<script id="decision-theme">
globalThis.BoardDecisionTheme = (() => {
  const key='board-decision-theme',valid=value=>['light','dark','system'].includes(value)?value:'system';
  function read() {try{return valid(globalThis.localStorage.getItem(key));}catch{return 'system';}}
  function set(value,persist=true) {
    const mode=valid(value);document.documentElement.dataset.theme=mode;
    if(persist)try{globalThis.localStorage.setItem(key,mode);}catch{}
    return mode;
  }
  set(read(),false);
  return {set};
})();
</script>

/* Layout: one reading column under a sticky tally bar. Decisions are open
   sections split by rules; only the options are boxed, because they are the
   things you pick. */
:root {
  color-scheme: light;
  --bg: #f2f4f8;
  --surface: #ffffff;
  --ink: #171f2d;
  --muted: #566176;
  --line: #d3d9e4;
  --accent: #2540c4;
  --accent-soft: #e7ebff;
  --on-accent: #ffffff;
  --rec: #7a4d00;
  --rec-bg: #fbedc6;
  --ok: #17734a;
  --warn: #9a4300;
  --display: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141b; --surface: #181e28; --ink: #e7ebf2; --muted: #9aa5b8; --line: #2c3545;
    --accent: #93a5ff; --accent-soft: #1f2a55; --on-accent: #0d1330;
    --rec: #f2c76a; --rec-bg: #3a2d0c; --ok: #6fd3a0; --warn: #f0a868;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141b; --surface: #181e28; --ink: #e7ebf2; --muted: #9aa5b8; --line: #2c3545;
  --accent: #93a5ff; --accent-soft: #1f2a55; --on-accent: #0d1330;
  --rec: #f2c76a; --rec-bg: #3a2d0c; --ok: #6fd3a0; --warn: #f0a868;
  color-scheme: dark;
}

[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.55 var(--body);
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 10;
  height: env(safe-area-inset-top, 0px); background: var(--bg);
}
.wrap {
  max-width: 46rem; margin-inline: auto; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}
code {
  font-family: var(--mono); font-size: .9em;
  background: var(--line); padding: 1px 5px; border-radius: 4px;
}
a { color: var(--accent); overflow-wrap: anywhere; }
.theme { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; }
.theme select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px; }
.theme select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Tally bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar-in {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px;
  padding-block: 8px;
}
.segs { display: flex; gap: 4px; }
.seg {
  position: relative; width: 26px; height: 26px; padding: 0; border: 0;
  background: none; cursor: pointer; border-radius: 4px;
}
.seg::after {
  content: ""; position: absolute; inset: 10px 0; border-radius: 3px;
  background: var(--line);
}
.seg[data-done="true"]::after { background: var(--accent); }
.seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tally { font: 500 13px/1.4 var(--mono); font-variant-numeric: tabular-nums; }
.sync { margin-left: auto; font-size: 13px; color: var(--muted); }
.sync[data-state="saved"] { color: var(--ok); }
.sync[data-state="failed"] { color: var(--warn); }

/* Opening */
.lede { padding-block: 40px 28px; display: grid; gap: 12px; }
h1 {
  margin: 0; font: 700 clamp(1.75rem, 5vw, 2.5rem)/1.08 var(--display);
  letter-spacing: -.01em; text-wrap: balance;
}
.intro { margin: 0; max-width: 62ch; color: var(--muted); }

/* One decision */
.decision {
  display: grid; gap: 16px; padding-block: 34px;
  border-top: 1px solid var(--line); scroll-margin-top: 60px;
}
.count {
  margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  font: 500 12px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); font-variant-numeric: tabular-nums;
}
.state {
  padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px;
  letter-spacing: .06em;
}
.decision[data-done="true"] .state { color: var(--ok); border-color: currentColor; }
h2 {
  margin: 0; font: 600 1.45rem/1.2 var(--display); text-wrap: balance;
}
.situation { display: grid; gap: 10px; max-width: 65ch; }
.situation p { margin: 0; }

.options { display: grid; gap: 10px; margin: 0; padding: 0; border: 0; min-width: 0; }
.opt {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px;
  padding: 14px 16px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; cursor: pointer;
}
.opt:hover { border-color: var(--muted); }
.opt:has(input:checked) {
  border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent);
  background: var(--accent-soft);
}
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); }
.opt-body { display: grid; gap: 6px; min-width: 0; }
.opt-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.opt-label { font-weight: 600; font-size: 1.03rem; }
.pill {
  font: 500 11px/1.5 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  padding: 1px 8px; border-radius: 999px; background: var(--rec-bg); color: var(--rec);
}
.trade {
  display: grid; grid-template-columns: 5.25rem minmax(0, 1fr); gap: 8px;
  font-size: .92rem; color: var(--muted);
}
.trade .k {
  font: 500 11px/1.5 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  padding-top: 3px;
}
.why {
  margin-top: 2px; padding-top: 8px; border-top: 1px dashed var(--line);
  font-size: .92rem; color: var(--rec);
}
.opt.other { background: transparent; border-style: dashed; }
.opt.other:has(input:checked) { background: var(--accent-soft); border-style: solid; }

.note { display: grid; gap: 6px; }
.note label { font-weight: 600; font-size: .92rem; }
.note label span { font-weight: 400; color: var(--muted); }
textarea {
  width: 100%; box-sizing: border-box; min-height: 5.5rem; padding: 10px 12px;
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; resize: vertical;
}
textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.hint { margin: 0; font-size: .88rem; color: var(--warn); }

/* Finish */
.finish {
  display: grid; gap: 14px; padding-block: 28px 72px;
  border-top: 2px solid var(--ink);
}
.finish p { margin: 0; max-width: 62ch; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.flash { font-size: .92rem; color: var(--ok); }
#copy-fallback { font: 13px/1.5 var(--mono); min-height: 12rem; }
.fatal { padding-block: 48px; color: var(--warn); }

<script id="decision-logic">
globalThis.BoardDecisions = (() => {
  function draftKey(role,item) { return `board-decision:${role}:${item.id}:${item.updated_at}`; }
  function valid(item,draft) {

    if(item.kind==='fyi')return ['comment','dismiss','comment_and_dismiss'].includes(draft.action)&&(draft.action==='dismiss'?!a.length:(!!draft.note.trim()||!!a.length));

  function payload(items,drafts) {
    return items.filter(item => valid(item,drafts[item.id])).map(item => ({item_id:item.id,expected_updated_at:item.updated_at,choice:drafts[item.id].choice,note:drafts[item.id].note}));
  }
  function outcome(item,draft,result) {

  }
  function finish(answers,results,win,confirm) {
    if(!answers.length || !Array.isArray(results) || results.length!==answers.length)return false;
    const outcomes=new Map(results.map(result=>[result?.item_id,result?.outcome]));
    if(outcomes.size!==answers.length || answers.some(answer=>!['resolved','already_resolved'].includes(outcomes.get(answer.item_id))))return false;

      if (!line.trim()) {lists=[];paragraph=null;continue;}
      const bullet=line.match(/^(\s*)(- |\d+\. )(.*)$/);

  const isCompletion=kind=>kind==='action'||kind==='todo';
  // Everything except decisions posts to the batched fyi-actions path (action_id + done/dropped).
  const endpoint=kind=>kind==='decision'?'/answers':'/fyi-actions';

    if(e.isComposing||e.altKey||e.shiftKey||!(e.metaKey||e.ctrlKey)||editable(e.target)||!rows.length)return null;

    return null;
  }
  return {draftKey,valid,payload,outcome,markup,inline,finish,batches,accepted,editable,navigate,TABS,isCompletion,endpoint,band,order,adjacent};
})();

    const boards=await Promise.all(nav.roles.map(async row=>{try{return {...await api(base(row.role_id)+'/decide-items'),role:row.role_id};}catch(e){if(e.unavailable){unavailable.push(row.role_id);return {role:row.role_id,items:[]};}throw e;}}));
    return {rows:nav.roles,boards,unavailable};
  }
  function sent(){
    finished=true;generation++;clearInterval(timer);storage.save('board-response-counts',{answers:0,comments:0,dismissals:0,completions:0});
    try{window.close();}catch{}
    if(window.closed)return;
    const main=el('main','wrap');main.tabIndex=-1;const section=el('section','confirmation');section.append(el('h1','','Actions sent — you can close this tab'),el('p','intro',`${acceptedCounts.answers} answers · ${acceptedCounts.comments} comments · ${acceptedCounts.dismissals} dismissals · ${acceptedCounts.completions} completions`),returnLink());main.append(section);document.body.replaceChildren(main);main.focus();
  }
  async function submit(closeAfter=false){
    if(busy||expired||finished)return;
    const q=queued();if(!q.length||q.some(r=>!L.valid(r.item,r.draft)))return;
    busy=true;generation++;pending=null;$('updates').hidden=true;render();
    let failed=false;
    for(const group of L.batches(q)){
      const previouslyUncertain=group.records.map(r=>!!r.draft.sent);
      const payload=group.records.map(r=>{
        const d=r.draft;if(d.sent)return d.sent;
        const p={item_id:r.item.id,expected_updated_at:r.item.updated_at,note:d.note};
        if(group.kind!=='decision'){d.action_id=d.action_id||Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');p.action_id=d.action_id;p.action=d.action;if(d.action==='dismiss')p.note=''; }else{p.choice=d.choice;p.action=d.choice?'answer':'comment';}
        if(anns(r).length){p.annotations=anns(r).map(({annotation_id,type,start_path,end_path,start_offset,end_offset,selected_text_hash,prefix,suffix,comment})=>({annotation_id,type,start_path,end_path,start_offset,end_offset,selected_text_hash,prefix,suffix,comment}));}
        if(!p.action_id&&(p.annotations?.length||p.action==='comment')){d.action_id=d.action_id||'action-'+crypto.getRandomValues(new Uint32Array(4)).join('-');p.action_id=d.action_id;}
        d.sent=p;return p;
      });persist();
      try{
        const response=await api(base(group.role)+L.endpoint(group.kind),'POST',group.kind==='decision'?{answers:payload}:{actions:payload});
        for(let n=0;n<group.records.length;n++){
          const r=group.records[n],p=payload[n];const matches=Array.isArray(response.results)&&response.results.length===payload.length?response.results.filter(v=>v.item_id===p.item_id&&(!p.action_id||v.action_id===p.action_id)):[];const result=matches.length===1?matches[0]:null;
          if(L.accepted(group.kind,p,result)){
            if(L.isCompletion(group.kind))acceptedCounts.completions++;else if(group.kind==='decision'&&p.action!=='comment')acceptedCounts.answers++;else{if(p.action!=='dismiss'&&result.outcome!=='already_resolved')acceptedCounts.comments++;if(group.kind==='fyi'&&p.action!=='comment')acceptedCounts.dismissals++;}
            if(!(p.action==='comment')){const row=rowFor(r.role);if(row){const field={fyi:'fyis',action:'actions',todo:'todos',decision:'decisions'}[group.kind];row[field]=Math.max(0,(row[field]||0)-1);}}
            r.draft=draft();r.status=p.action==='comment'?'Comment sent · still open':p.action==='dropped'?'Dropped':p.action==='done'?'Done':'Accepted';r.closed=p.action!=='comment';
          }else{
            failed=true;r.status=result?.outcome||'Result unconfirmed. Retry to confirm.';
            if(result&&['conflict','invalid','not_found','already_resolved'].includes(result.outcome)){
              const note=r.draft.note,stale=anns(r).length?{revision:r.item.updated_at,note,annotations:anns(r)}:undefined;r.draft={...r.draft,sent:undefined,action_id:undefined};
              if(result.outcome==='conflict'){r.item=result.item;r.draft={...draft(),note,...(stale?{stale}:{})};r.status='Item changed. Note and annotations kept; review the stale draft and choose your response again.';}
            }
          }
        }
      }catch(e){
        failed=true;for(const [n,r] of group.records.entries()){r.status=e.message;if(e.unavailable)r.unavailable=true;if(e.definitive&&!previouslyUncertain[n]){delete r.draft.sent;delete r.draft.action_id;}}
      }
      persist();
    }
    if(!failed&&!closeAfter){
      screen='browse';
      try{const next=await snapshot();busy=false;message('Actions sent. You can keep reviewing.');const sent=$('status').textContent;setTimeout(()=>{if($('status').textContent===sent)$('status').textContent='';},4000);reconcile(next);}
      catch(e){busy=false;message('Actions sent. Board refresh failed: '+e.message);render();}return;
    }
    busy=false;
    if(!failed&&closeAfter){sent();return;}
    screen='review';message((Object.values(acceptedCounts).some(n=>n>0)?'Some actions were accepted.':'No actions were confirmed.')+' Review the remaining responses and retry; accepted actions are cleared.');render();
  }
  function closeDrawer(){$('drawer').close();$('drawer-trigger').focus();}
  $('drawer-trigger').onclick=()=>{$('drawer').showModal();};$('drawer-close').onclick=closeDrawer;$('drawer').addEventListener('cancel',e=>{e.preventDefault();closeDrawer();});
  $('drawer').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const nodes=[...$('drawer').querySelectorAll('button')],first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}});
  document.addEventListener('keydown',e=>{if(busy||finished||$('drawer').open||sheet.open||composer||getSelection()?.toString())return;const next=L.navigate(e,rows,selected,tab);if(!next)return;e.preventDefault();selected=next.role;tab=next.tab;screen='browse';render();$('main').focus({preventScroll:true});});
  let touch=null;$('main').addEventListener('touchstart',e=>{touch=e.touches.length===1&&!L.editable(e.target)&&!e.target.closest('button,a,label,input,textarea,select,[data-field],mark,[role="button"],[role="tab"]')?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
  $('main').addEventListener('touchend',e=>{const start=touch;touch=null;if(!start||!e.changedTouches.length||busy||screen!=='browse'||getSelection()?.toString())return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5){tab=L.adjacent(tab,dx);render();}},{passive:true});
  $('theme').value=document.documentElement.dataset.theme||'system';$('theme').onchange=()=>BoardDecisionTheme.set($('theme').value);
  $('review').onclick=()=>{screen='review';render();};$('submit').onclick=()=>submit(false);$('submit-close').onclick=()=>submit(true);$('refresh').onclick=()=>{if(pending&&!busy)reconcile(pending);};
  $('copy').onclick=async()=>{
    const text=queued().map(r=>`${labelFor(r.role)}\n#${r.item.id} ${r.item.subject}\n${r.draft.choice||r.draft.action}\n${r.draft.action==='dismiss'?'':r.draft.note}\n${anns(r).map(a=>`${a.type==='DELETION'?'Delete suggestion':'Comment'}: ${a.quote}\n${a.comment}`).join('\n')}`).join('\n\n');
    try{await navigator.clipboard.writeText(text);if(!finished)$('summary').textContent='Responses copied.';}catch{if(finished)return;$('copy-fallback').hidden=false;$('copy-fallback').value=text;$('copy-fallback').select();}
  };
  async function poll(){
    if(document.hidden||busy||expired||finished||polling)return;
    const epoch=generation;polling=true;
    try{const next=await snapshot();if(finished||busy||epoch!==generation)return;if(acceptedSnapshot!==JSON.stringify(next)){pending=next;$('updates').hidden=false;}}
    catch(e){if(!finished&&epoch===generation)message(e.message);}
    finally{polling=false;}
  }
  const timer=setInterval(poll,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});
  try{
    const savedCounts=storage.read('board-response-counts');if(savedCounts)for(const k of Object.keys(acceptedCounts))acceptedCounts[k]=Number.isSafeInteger(savedCounts[k])&&savedCounts[k]>0?savedCounts[k]:0;
    const saved=storage.read(draftKey);if(saved&&typeof saved==='object')records=Object.fromEntries(Object.entries(saved).filter(([,r])=>r?.item&&r?.draft&&typeof r.draft.note==='string'));
    if(ticket){try{sessionStorage.removeItem(sessionKey);}catch{};const exchange=await api('/api/hera/board/decision-session','POST',{ticket});session=exchange.session;selected=Number(exchange.initial_role_id)||0;try{sessionStorage.setItem(sessionKey,JSON.stringify({session,initial_role_id:selected}));}catch{message('Session storage unavailable. Keep this page open.');}}
    else{let savedSession;try{savedSession=JSON.parse(sessionStorage.getItem(sessionKey));}catch{}session=savedSession?.session||'';selected=Number(savedSession?.initial_role_id)||0;}
    if(!session){expire();render();return;}
    const epoch=generation,next=await snapshot();if(finished||epoch!==generation)return;
    reconcile(next);const initial=Object.values(records).find(r=>r.role===selected&&r.item.id===focus&&!r.closed);
    const counts=rowFor(selected);tab=initial?.item.kind||(counts&&L.TABS.find(k=>countOf(counts,k)))||'decision';render();
    if(initial){const n=document.getElementById(`decision-${focus}`);n?.classList.add('focused');n?.scrollIntoView();}
  }catch(e){if(!finished){message(e.message);render();}}
})();
