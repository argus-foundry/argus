<script id="decision-theme">
globalThis.BoardDecisionTheme = (() => {
  const key='board-decision-theme',valid=value=>['light','dark','system'].includes(value)?value:'system';
  function read() {try{return valid(globalThis.localStorage.getItem(key));}catch{return 'system';}}
  function set(value,persist=true) {
    const mode=valid(value);document.documentElement.dataset.theme=mode;
    if(persist)try{globalThis.localStorage.setItem(key,mode);}catch{}
    return mode;
  }
  set(read(),false);
  return {set};
})();
</script>
<style>
/* Layout: one reading column under a sticky tally bar. Decisions are open
   sections split by rules; only the options are boxed, because they are the
   things you pick. */
:root {
  color-scheme: light;
  --bg: #f2f4f8;
  --surface: #ffffff;
  --ink: #171f2d;
  --muted: #566176;
  --line: #d3d9e4;
  --accent: #2540c4;
  --accent-soft: #e7ebff;
  --on-accent: #ffffff;
  --rec: #7a4d00;
  --rec-bg: #fbedc6;
  --ok: #17734a;
  --warn: #9a4300;
  --display: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141b; --surface: #181e28; --ink: #e7ebf2; --muted: #9aa5b8; --line: #2c3545;
    --accent: #93a5ff; --accent-soft: #1f2a55; --on-accent: #0d1330;
    --rec: #f2c76a; --rec-bg: #3a2d0c; --ok: #6fd3a0; --warn: #f0a868;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141b; --surface: #181e28; --ink: #e7ebf2; --muted: #9aa5b8; --line: #2c3545;
  --accent: #93a5ff; --accent-soft: #1f2a55; --on-accent: #0d1330;
  --rec: #f2c76a; --rec-bg: #3a2d0c; --ok: #6fd3a0; --warn: #f0a868;
  color-scheme: dark;
}

[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.55 var(--body);
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 10;
  height: env(safe-area-inset-top, 0px); background: var(--bg);
}
.wrap {
  max-width: 46rem; margin-inline: auto; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}
code {
  font-family: var(--mono); font-size: .9em;
  background: var(--line); padding: 1px 5px; border-radius: 4px;
}
a { color: var(--accent); overflow-wrap: anywhere; }
.theme { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; }
.theme select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px; }
.theme select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Tally bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar-in {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px;
  padding-block: 8px;
}
.segs { display: flex; gap: 4px; }
.seg {
  position: relative; width: 26px; height: 26px; padding: 0; border: 0;
  background: none; cursor: pointer; border-radius: 4px;
}
.seg::after {
  content: ""; position: absolute; inset: 10px 0; border-radius: 3px;
  background: var(--line);
}
.seg[data-done="true"]::after { background: var(--accent); }
.seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tally { font: 500 13px/1.4 var(--mono); font-variant-numeric: tabular-nums; }
.sync { margin-left: auto; font-size: 13px; color: var(--muted); }
.sync[data-state="saved"] { color: var(--ok); }
.sync[data-state="failed"] { color: var(--warn); }

/* Opening */
.lede { padding-block: 40px 28px; display: grid; gap: 12px; }
h1 {
  margin: 0; font: 700 clamp(1.75rem, 5vw, 2.5rem)/1.08 var(--display);
  letter-spacing: -.01em; text-wrap: balance;
}
.intro { margin: 0; max-width: 62ch; color: var(--muted); }

/* One decision */
.decision {
  display: grid; gap: 16px; padding-block: 34px;
  border-top: 1px solid var(--line); scroll-margin-top: 60px;
}
.count {
  margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  font: 500 12px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); font-variant-numeric: tabular-nums;
}
.state {
  padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px;
  letter-spacing: .06em;
}
.decision[data-done="true"] .state { color: var(--ok); border-color: currentColor; }
h2 {
  margin: 0; font: 600 1.45rem/1.2 var(--display); text-wrap: balance;
}
.situation { display: grid; gap: 10px; max-width: 65ch; }
.situation p { margin: 0; }

.options { display: grid; gap: 10px; margin: 0; padding: 0; border: 0; min-width: 0; }
.opt {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px;
  padding: 14px 16px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; cursor: pointer;
}
.opt:hover { border-color: var(--muted); }
.opt:has(input:checked) {
  border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent);
  background: var(--accent-soft);
}
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); }
.opt-body { display: grid; gap: 6px; min-width: 0; }
.opt-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.opt-label { font-weight: 600; font-size: 1.03rem; }
.pill {
  font: 500 11px/1.5 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  padding: 1px 8px; border-radius: 999px; background: var(--rec-bg); color: var(--rec);
}
.trade {
  display: grid; grid-template-columns: 5.25rem minmax(0, 1fr); gap: 8px;
  font-size: .92rem; color: var(--muted);
}
.trade .k {
  font: 500 11px/1.5 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  padding-top: 3px;
}
.why {
  margin-top: 2px; padding-top: 8px; border-top: 1px dashed var(--line);
  font-size: .92rem; color: var(--rec);
}
.opt.other { background: transparent; border-style: dashed; }
.opt.other:has(input:checked) { background: var(--accent-soft); border-style: solid; }

.note { display: grid; gap: 6px; }
.note label { font-weight: 600; font-size: .92rem; }
.note label span { font-weight: 400; color: var(--muted); }
textarea {
  width: 100%; box-sizing: border-box; min-height: 5.5rem; padding: 10px 12px;
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; resize: vertical;
}
textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.hint { margin: 0; font-size: .88rem; color: var(--warn); }

/* Finish */
.finish {
  display: grid; gap: 14px; padding-block: 28px 72px;
  border-top: 2px solid var(--ink);
}
.finish p { margin: 0; max-width: 62ch; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.flash { font-size: .92rem; color: var(--ok); }
#copy-fallback { font: 13px/1.5 var(--mono); min-height: 12rem; }
.fatal { padding-block: 48px; color: var(--warn); }

.focused {outline:2px solid var(--accent);outline-offset:8px;} .btn:disabled{opacity:.5;cursor:default;} .segs {flex-wrap:wrap;} .decision{overflow-wrap:anywhere;} </style>

<script id="decision-logic">
globalThis.BoardDecisions = (() => {
  function draftKey(role,item) { return `board-decision:${role}:${item.id}:${item.updated_at}`; }
  function valid(item,draft) {
    if (!draft || typeof draft.note!=='string') return false;
    if (draft.choice === 'other') return !!draft.note.trim();
    return !!item.structured?.options.some(option => option.id === draft.choice);
  }
  function payload(items,drafts) {
    return items.filter(item => valid(item,drafts[item.id])).map(item => ({item_id:item.id,expected_updated_at:item.updated_at,choice:drafts[item.id].choice,note:drafts[item.id].note}));
  }
  function outcome(item,draft,result) {
    if (result.outcome === 'conflict') return {item:result.item,draft:{choice:'',note:draft?.note || ''},status:'conflict'};
    return {item,draft,status:result.outcome === 'resolved' ? 'answered' : ['already_resolved','not_found'].includes(result.outcome) ? 'closed' : 'invalid'};
  }
  function finish(answers,results,win,confirm) {
    if(!answers.length || !Array.isArray(results) || results.length!==answers.length)return false;
    const outcomes=new Map(results.map(result=>[result?.item_id,result?.outcome]));
    if(outcomes.size!==answers.length || answers.some(answer=>!['resolved','already_resolved'].includes(outcomes.get(answer.item_id))))return false;
    try{win.close();}catch{}
    if(!win.closed)confirm(answers.length);
    return true;
  }
  function links(parent,text,doc) {
    let at=0;
    for(const match of text.matchAll(/\bhttps?:\/\/[^\s<>"'`]+/gi)) {
      let url=match[0];
      // Sentence punctuation is text; balanced URL brackets stay in the link.
      const pairs={')':'(',']':'[','}':'{'};
      while(url) {
        const end=url.slice(-1),open=pairs[end];
        if(/[.,!?:;]/.test(end) || (open && url.split(end).length>url.split(open).length))url=url.slice(0,-1);else break;
      }
      try {const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol) || !parsed.hostname)continue;}catch{continue;}
      parent.append(doc.createTextNode(text.slice(at,match.index)));
      const link=doc.createElement('a');link.textContent=url;
      link.setAttribute('href',url);link.setAttribute('target','_blank');link.setAttribute('rel','noopener noreferrer');parent.append(link);
      at=match.index+url.length;
    }
    parent.append(doc.createTextNode(text.slice(at)));
  }
  function inline(parent,text,doc) {
    let at=0;
    for (const match of text.matchAll(/(`[^`]+`|\*\*[^*]+\*\*)/g)) {
      links(parent,text.slice(at,match.index),doc);
      const bold=match[0].startsWith('**'),node=doc.createElement(bold ? 'strong':'code');
      const content=match[0].slice(bold?2:1,bold?-2:-1);
      if(bold)inline(node,content,doc);else node.textContent=content;
      parent.append(node);at=match.index+match[0].length;
    }
    links(parent,text.slice(at),doc);
  }
  function markup(text,doc) {
    const root=doc.createElement('div');let list=null,listTag='',paragraph=null;
    for (const line of String(text || '').split('\n')) {
      if (!line.trim()) {list=null;paragraph=null;continue;}
      const bullet=line.match(/^\s*(- |\d+\. )(.*)$/);
      if (bullet) {
        const tag=bullet[1]==='- '?'ul':'ol';
        if (!list || listTag!==tag) {list=doc.createElement(tag);root.append(list);listTag=tag;}
        const li=doc.createElement('li');inline(li,bullet[2],doc);list.append(li);paragraph=null;
      } else {
        list=null;if (!paragraph) {paragraph=doc.createElement('p');root.append(paragraph);} else paragraph.append(doc.createTextNode(' '));inline(paragraph,line,doc);
      }
    }
    return root;
  }
  return {draftKey,valid,payload,outcome,markup,inline,finish};
})();

function update(){const q=queued(),invalid=q.some(i=>!valid(i));$('tally').textContent=selected?`${coords.find(c=>c.id===selected).name} · ${q.length} queued`:`All coordinators · ${counts().d+counts().f} open`;$('submit').disabled=!q.length||invalid;$('submit').textContent=`Submit ${q.length||''} action${q.length===1?'':'s'}`;$('review').disabled=!q.length;$('queued-description').textContent=q.length?`${q.length} queued across ${new Set(q.map(i=>i.role)).size} coordinator${new Set(q.map(i=>i.role)).size===1?'':'s'}.${invalid?' Add the required note before submitting.':''}`:'Only selected actions are submitted. Everything else stays open.';}
function heading(title,copy){const h=node('section','lede');h.append(node('h1','',title),node('p','intro',copy));return h;}
function drawNav(){for(const id of ['desktop-nav','phone-nav']){const nav=$(id);nav.replaceChildren();for(const c of coords){const ct=counts(c.id),n=ct.d+ct.f,b=btn('',()=>{selected=c.id;screen='browse';render();if($('drawer').open)closeDrawer();top();},`rail-row${c.parent?' nested':''}${!n?' empty':''}`);b.dataset.role=c.id;b.setAttribute('aria-current',String(selected===c.id));b.setAttribute('aria-label',`${c.name}${c.parent?', sub-coordinator':''}, ${ct.d} decisions, ${ct.f} FYIs${!n?', nothing open':''}`);if(c.parent)b.append(node('span','row-branch','↳'));b.append(node('span','row-name',c.name));if(n){const count=node('span','row-counts');count.setAttribute('aria-hidden','true');for(const [kind,n] of [['decision',ct.d],['fyi',ct.f]]){const badge=node('span',`count-badge ${kind}${!n?' zero':''}`,String(n));count.append(badge);}b.append(count);}if(queued().some(i=>i.role===c.id)){const dot=node('span','queued-dot');dot.setAttribute('aria-label','Has queued responses');b.append(dot);}nav.append(b);}}$('drawer-trigger').textContent=`${coords.find(c=>c.id===selected)?.name||'Coordinators'} ▾`;}
function renderBoard(main){const coord=coords.find(c=>c.id===selected),ct=counts(selected);main.append(heading(coord.name,'Choose the answers you’re ready to give. The rest stay open.'));main.append(node('p','mock-scope',coord.parent?'Sub-coordinator · Release readiness':'Coordinator board'));const tabs=node('div','tabs');tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','Board items');for(const [kind,label,n] of [['decision','Decisions',ct.d],['fyi','FYIs',ct.f]]){const b=btn('',()=>{tab=kind;render();});b.setAttribute('role','tab');b.setAttribute('aria-selected',String(tab===kind));b.setAttribute('aria-label',`${label}, ${n} open`);const badge=node('span',`count-badge ${kind}${!n?' zero':''}`,String(n));badge.setAttribute('aria-hidden','true');b.append(node('span','',label),badge);tabs.append(b);}main.append(tabs,node('p','tabs-help','⌘ / Ctrl ← Decisions · → FYIs'));const visible=open(selected).filter(i=>i.kind===tab);if(!visible.length){const empty=node('section','decision');empty.append(node('h2','',ct.d+ct.f?`No open ${tab==='fyi'?'FYIs':'decisions'}`:`Nothing open for ${coord.name}`),node('p','intro',ct.d+ct.f?'The other tab may still have items.':'This board is caught up. Choose another coordinator whenever you’re ready.'));main.append(empty);}if(tab==='decision'&&visible.some(i=>i.structured&&!draft(i).choice)){const strip=node('div','actions');strip.style.marginTop='10px';strip.append(btn('Take the recommendations',()=>{for(const i of visible)if(i.structured&&!draft(i).choice)draft(i).choice=i.structured.recommended;render();}));main.append(strip);}for(const i of visible)renderCard(main,i);}
function renderCard(main,i){const d=draft(i),card=node('section','decision');card.id=`item-${i.id}`;const count=node('p','count',`${i.kind==='fyi'?'FYI':'Decision'} #${i.id}`);const state=node('span','state',i.commented?'Comment sent · still open':(i.kind==='decision'?d.choice||anns(i).length:d.action||anns(i).length)?'Queued':'Open');count.append(state);count.append(btn('Annotations '+anns(i).length,()=>openPanel(i.id),'annotation-trigger'));card.append(count,fmt('h2','',i.subject));card.onpointerdown=e=>{if(!e.target.closest('button,input,textarea')){activeItem=i.id;renderPanel();}};const body=node('div','situation');body.append(selectableBody(i));card.append(body);
if(i.kind==='decision'&&i.structured){const options=node('fieldset','options');options.setAttribute('aria-label',i.subject);for(const o of [...i.structured.options,{id:'other',label:'Something else'}]){const label=node('div',`opt${o.id==='other'?' other':''}`),input=node('input');input.type='radio';input.name=`choice-${i.id}`;input.value=o.id;input.checked=d.choice===o.id;input.onchange=()=>{d.choice=o.id;state.textContent='Queued';hint.hidden=!(d.choice==='other'&&!d.note.trim());update();};const ob=node('div','opt-body'),head=node('div','opt-head');input.setAttribute('aria-label','Choose '+o.label);head.append(selectable(i,`option:${o.id}:label`,o.label,'opt-label'));if(o.id===i.structured.recommended)head.append(node('span','pill','Recommended'));ob.append(head);if(o.summary)ob.append(selectable(i,`option:${o.id}:summary`,o.summary));for(const [k,v]of [['Upside',o.upside],['Downside',o.downside]])if(v){const row=node('div','trade');row.append(node('span','k',k),selectable(i,`option:${o.id}:${k.toLowerCase()}`,v));ob.append(row);}if(o.id===i.structured.recommended)ob.append(selectable(i,`option:${o.id}:reason`,i.structured.reason,'why'));label.append(input,ob);options.append(label);}card.append(options);}
const note=node('div','note'),label=node('label','',i.kind==='fyi'?'General comment':i.structured?'General comment (required for Something else)':'Your answer / general comment'),text=node('textarea');text.id=`note-${i.id}`;label.htmlFor=text.id;text.value=d.note;text.placeholder=i.kind==='fyi'?'Add feedback for this coordinator…':'Add context…';text.maxLength=4096;text.oninput=()=>{d.note=text.value;if(i.kind==='decision'&&!i.structured)d.choice=d.note.trim()?'other':'';hint.hidden=!(i.kind==='decision'?d.choice==='other'&&!d.note.trim():d.action&&d.action!=='dismiss'&&!d.note.trim()&&!anns(i).length);state.textContent=(i.kind==='decision'?d.choice||anns(i).length:d.action||anns(i).length)?'Queued':'Open';update();};note.append(label,text);card.append(note);const hint=node('p','hint','Add a note to send this response.');hint.hidden=!(i.kind==='decision'?d.choice==='other'&&!d.note.trim():d.action&&d.action!=='dismiss'&&!d.note.trim()&&!anns(i).length);hint.setAttribute('role','alert');card.append(hint);
if(i.kind==='fyi'){const actions=node('div','fyi-actions');for(const [key,name]of [['comment','Comment'],['dismiss','Dismiss'],['comment_and_dismiss','Comment and dismiss']]){const b=btn(name,()=>{d.action=d.action===key?'':key;if(d.action==='dismiss'&&anns(i).length)d.action='comment_and_dismiss';render();});b.setAttribute('aria-pressed',String(d.action===key));actions.append(b);}card.append(actions,node('p','subtle',d.action==='dismiss'?'Will dismiss silently. No coordinator message.':d.action==='comment_and_dismiss'?'Will send your comment and resolve this FYI.':d.action==='comment'?'Will send your comment. This FYI stays open.':'Choose an action to queue it. Save an annotation or choose a feedback action.'));}if(i.kind==='decision'&&d.choice)card.append(btn('Clear queued answer',()=>{d.choice='';d.note='';render();},'clear'));main.append(card);}
function renderReview(main){main.append(heading('Queued responses','These actions will be submitted together. Unselected items stay open.'));main.append(btn('← Keep reviewing boards',()=>{screen='browse';render();top();}));for(const c of coords){const list=queued().filter(i=>i.role===c.id);if(!list.length)continue;const section=node('section','review-list');section.style.marginTop='28px';section.append(node('h2','',c.name));for(const i of list){const row=node('div','receipt');row.append(node('strong','',`${actionLabel(i)} · #${i.id} ${i.subject}`));if(i.kind==='decision')row.append(node('p','',i.structured?.options.find(o=>o.id===draft(i).choice)?.label||'Something else'));if(draft(i).note&&draft(i).action!=='dismiss')row.append(node('p','subtle',draft(i).note));if(i.kind==='decision'&&!draft(i).choice)row.children[1].textContent='Feedback only · decision stays open';for(const a of sortedAnnotations(i)){const feedback=node('div','annotation-card');feedback.append(node('strong',a.type==='DELETION'?'delete-label':'',a.type==='DELETION'?'Delete suggestion':'Comment'),node('blockquote','',a.quote));if(a.comment)feedback.append(node('p','',a.comment));row.append(feedback);}row.append(btn('Edit on board',()=>{visit(i.role);tab=i.kind;render();document.getElementById(`item-${i.id}`).scrollIntoView();},'clear'));section.append(row);}main.append(section);}}
function renderSent(main){const h=node('section','confirmation');h.append(node('p','preview-label','Simulated submission · nothing was sent'),node('h1','','Actions sent — you can close this tab'));const a=receipts.filter(r=>r.kind==='decision'&&r.choice).length,c=receipts.filter(r=>r.kind==='decision'&&!r.choice||r.action==='comment'||r.action==='comment_and_dismiss').length,x=receipts.filter(r=>r.action==='dismiss'||r.action==='comment_and_dismiss').length;h.append(node('p','intro',`${a} answer${a===1?'':'s'} · ${c} comment${c===1?'':'s'} · ${x} dismissal${x===1?'':'s'}`));for(const co of coords){const rows=receipts.filter(r=>r.role===co.id);if(!rows.length)continue;const group=node('div','receipt');group.append(node('strong','',co.name));for(const r of rows)group.append(node('p','subtle',`#${r.id} · ${r.kind==='decision'?(r.choice?'Answered':'Comment sent · decision stays open'):r.action==='comment'?'Comment sent · FYI stays open':r.action==='dismiss'?'Dismissed silently':'Comment sent · FYI dismissed'}`));h.append(group);}h.append(node('p','subtle','All selected actions succeeded. Unselected items stay open.'));h.append(btn('Return to Argus',()=>{screen='browse';selected=12;render();top();},'btn primary'));h.append(btn('Reset and try again',reset));main.append(h);}
function render(){toolbar.hidden=true;const main=$('main');main.replaceChildren();$('queue').hidden=screen==='sent';if(screen==='sent')renderSent(main);else if(screen==='review')renderReview(main);else renderBoard(main);drawNav();update();paintHighlights();renderPanel();}
function reset(){items=structuredClone(original);drafts={};seedAnnotations();receipts=[];screen='browse';selected=12;tab='decision';activeItem=101;composer=null;render();top();}
function closeDrawer(){$('drawer').close();$('drawer-trigger').focus();}
$('drawer-trigger').onclick=()=>{$('drawer').showModal();};$('drawer-close').onclick=closeDrawer;$('drawer').addEventListener('cancel',e=>{e.preventDefault();closeDrawer();});
function editable(target){return target instanceof Element&&!!target.closest('input,textarea,select,[contenteditable]:not([contenteditable="false"]),[role="textbox"]');}
document.addEventListener('keydown',e=>{if(e.isComposing||e.altKey||e.shiftKey||!(e.metaKey||e.ctrlKey)||editable(e.target)||$('drawer').open||screen==='sent')return;if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if(e.key==='ArrowUp'||e.key==='ArrowDown'){const at=coords.findIndex(c=>c.id===selected),next=Math.max(0,Math.min(coords.length-1,at+(e.key==='ArrowDown'?1:-1)));selected=coords[next].id;}else tab=e.key==='ArrowLeft'?'decision':'fyi';screen='browse';render();top();});
let touchStart=null;$('main').addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('button,input,textarea,select,a,label,.selectable,mark,[contenteditable]')){touchStart=null;return;}touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});$('main').addEventListener('touchend',e=>{if(!touchStart||!e.changedTouches.length||screen!=='browse')return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5){tab=dx<0?'fyi':'decision';render();}},{passive:true});
$('reset').onclick=reset;$('review').onclick=()=>{screen='review';render();top();};$('submit').onclick=()=>{const q=queued();if(!q.length||q.some(i=>!valid(i)))return;receipts=q.map(i=>({...i,...draft(i)}));for(const i of q){if(i.kind==='decision'?!!draft(i).choice:draft(i).action!=='comment')i.closed=true;else i.commented=true;drafts[i.id]={choice:'',note:'',action:''};}screen='sent';render();top();};$('theme').value=document.documentElement.dataset.theme||'system';$('theme').onchange=()=>BoardDecisionTheme.set($('theme').value);const initial=counts(selected);tab=initial.d?'decision':initial.f?'fyi':'decision';render();
})();
</script>
