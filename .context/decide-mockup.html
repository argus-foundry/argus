<script id="decision-theme">
globalThis.BoardDecisionTheme = (() => {
  const key='board-decision-theme',valid=value=>['light','dark','system'].includes(value)?value:'system';
  function read() {try{return valid(globalThis.localStorage.getItem(key));}catch{return 'system';}}
  function set(value,persist=true) {
    const mode=valid(value);document.documentElement.dataset.theme=mode;
    if(persist)try{globalThis.localStorage.setItem(key,mode);}catch{}
    return mode;
  }
  set(read(),false);
  return {set};
})();

:root {

}
:root[data-theme="dark"] {

.opt-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }

.pill {

.trade {

.why {

.opt.other { background: transparent; border-style: dashed; }
.opt.other:has(input:checked) { background: var(--accent-soft); border-style: solid; }

.note { display: grid; gap: 6px; }
.note label { font-weight: 600; font-size: .92rem; }

textarea {

textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.hint { margin: 0; font-size: .88rem; color: var(--warn); }

/* Finish */
.finish {
  display: grid; gap: 14px; padding-block: 28px 72px;
  border-top: 2px solid var(--ink);
}
.finish p { margin: 0; max-width: 62ch; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  cursor: pointer;

.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.flash { font-size: .92rem; color: var(--ok); }
#copy-fallback { font: 13px/1.5 var(--mono); min-height: 12rem; }
.fatal { padding-block: 48px; color: var(--warn); }

.focused {outline:2px solid var(--accent);outline-offset:8px;} .btn:disabled{opacity:.5;cursor:default;} .segs {flex-wrap:wrap;} .decision{overflow-wrap:anywhere;} </style>

<script id="decision-logic">
globalThis.BoardDecisions = (() => {
  function draftKey(role,item) { return `board-decision:${role}:${item.id}:${item.updated_at}`; }
  function valid(item,draft) {
    if (!draft || typeof draft.note!=='string') return false;
    if (draft.choice === 'other') return !!draft.note.trim();
    return !!item.structured?.options.some(option => option.id === draft.choice);
  }
  function payload(items,drafts) {
    return items.filter(item => valid(item,drafts[item.id])).map(item => ({item_id:item.id,expected_updated_at:item.updated_at,choice:drafts[item.id].choice,note:drafts[item.id].note}));
  }
  function outcome(item,draft,result) {
    if (result.outcome === 'conflict') return {item:result.item,draft:{choice:'',note:draft?.note || ''},status:'conflict'};
    return {item,draft,status:result.outcome === 'resolved' ? 'answered' : ['already_resolved','not_found'].includes(result.outcome) ? 'closed' : 'invalid'};
  }
  function finish(answers,results,win,confirm) {
    if(!answers.length || !Array.isArray(results) || results.length!==answers.length)return false;
    const outcomes=new Map(results.map(result=>[result?.item_id,result?.outcome]));
    if(outcomes.size!==answers.length || answers.some(answer=>!['resolved','already_resolved'].includes(outcomes.get(answer.item_id))))return false;
    try{win.close();}catch{}
    if(!win.closed)confirm(answers.length);
    return true;
  }
  function links(parent,text,doc) {
    let at=0;
    for(const match of text.matchAll(/\bhttps?:\/\/[^\s<>"'`]+/gi)) {
      let url=match[0];
      // Sentence punctuation is text; balanced URL brackets stay in the link.
      const pairs={')':'(',']':'[','}':'{'};
      while(url) {
        const end=url.slice(-1),open=pairs[end];
        if(/[.,!?:;]/.test(end) || (open && url.split(end).length>url.split(open).length))url=url.slice(0,-1);else break;
      }
      try {const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol) || !parsed.hostname)continue;}catch{continue;}
      parent.append(doc.createTextNode(text.slice(at,match.index)));
      const link=doc.createElement('a');link.textContent=url;
      link.setAttribute('href',url);link.setAttribute('target','_blank');link.setAttribute('rel','noopener noreferrer');parent.append(link);
      at=match.index+url.length;
    }
    parent.append(doc.createTextNode(text.slice(at)));
  }
  function inline(parent,text,doc) {
    let at=0;
    for (const match of text.matchAll(/(`[^`]+`|\*\*[^*]+\*\*)/g)) {
      links(parent,text.slice(at,match.index),doc);
      const bold=match[0].startsWith('**'),node=doc.createElement(bold ? 'strong':'code');
      const content=match[0].slice(bold?2:1,bold?-2:-1);
      if(bold)inline(node,content,doc);else node.textContent=content;
      parent.append(node);at=match.index+match[0].length;
    }
    links(parent,text.slice(at),doc);
  }
  function markup(text,doc) {
    const root=doc.createElement('div');let list=null,listTag='',paragraph=null;
    for (const line of String(text || '').split('\n')) {
      if (!line.trim()) {list=null;paragraph=null;continue;}
      const bullet=line.match(/^\s*(- |\d+\. )(.*)$/);
      if (bullet) {
        const tag=bullet[1]==='- '?'ul':'ol';
        if (!list || listTag!==tag) {list=doc.createElement(tag);root.append(list);listTag=tag;}
        const li=doc.createElement('li');inline(li,bullet[2],doc);list.append(li);paragraph=null;
      } else {
        list=null;if (!paragraph) {paragraph=doc.createElement('p');root.append(paragraph);} else paragraph.append(doc.createTextNode(' '));inline(paragraph,line,doc);
      }
    }
    return root;
  }
  return {draftKey,valid,payload,outcome,markup,inline,finish};
})();
</script>

function heading(title,copy){const h=node('section','lede');h.append(node('h1','',title),node('p','intro',copy));return h;}
function renderDirectory(main){main.append(heading('Your boards','Open a coordinator’s board to answer decisions or handle FYIs.'));const c=counts(),stats=node('p','mock-scope',`${c.d} decisions · ${c.f} FYIs · ${coords.length} coordinators`);main.append(stats);const list=node('div','directory');for(const coord of coords){const ct=counts(coord.id),q=queued().filter(i=>i.role===coord.id).length,b=btn('',()=>visit(coord.id),'btn directory-row');b.append(node('strong','',coord.name),node('span','subtle',coord.summary));const m=node('span','directory-meta');m.append(node('span','',`${ct.d} decisions · ${ct.f} FYIs`),node('span',q?'queued':'',q?`${q} queued →`:'Open board →'));b.append(m);list.append(b);}main.append(list);}
function renderBoard(main){const coord=coords.find(c=>c.id===selected),ct=counts(selected);if(mode==='phone'){const switcher=node('div','switcher');switcher.append(btn('← All coordinators',()=>{selected=null;render();top();}));const label=node('label','','Coordinator'),select=node('select');select.id='coordinator';for(const c of coords){const opt=node('option','',`${c.name} · ${counts(c.id).d+counts(c.id).f} open`);opt.value=c.id;select.append(opt);}select.value=selected;select.onchange=()=>visit(Number(select.value));label.append(select);switcher.append(label);main.append(switcher);}main.append(heading(coord.name,'Choose the answers you’re ready to give. The rest stay open.'));main.append(node('p','mock-scope',mode==='tui'?'Opened with o · This coordinator’s board only':`Coordinator board · ${coord.role}`));const tabs=node('div','tabs');tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','Board items');for(const [kind,label,n] of [['decision','Decisions',ct.d],['fyi','FYIs',ct.f]]){const b=btn(`${label} (${n})`,()=>{tab=kind;render();});b.setAttribute('role','tab');b.setAttribute('aria-selected',String(tab===kind));tabs.append(b);}main.append(tabs);const visible=open(selected).filter(i=>i.kind===tab);if(!visible.length){const empty=node('section','decision');empty.append(node('h2','',`No open ${tab==='fyi'?'FYIs':'decisions'}`),node('p','intro','You’re caught up here. The other tab may still have items.'));main.append(empty);}if(tab==='decision'&&visible.some(i=>i.structured&&!draft(i).choice)){const strip=node('div','actions');strip.style.marginTop='20px';strip.append(btn('Take the recommendations',()=>{for(const i of visible)if(i.structured&&!draft(i).choice)draft(i).choice=i.structured.recommended;render();}));main.append(strip);}for(const i of visible)renderCard(main,i);}
function renderCard(main,i){const d=draft(i),card=node('section','decision');card.id=`item-${i.id}`;const count=node('p','count',`${i.kind==='fyi'?'FYI':'Decision'} #${i.id}`);const state=node('span','state',i.commented?'Comment sent · still open':(i.kind==='decision'?d.choice:d.action)?'Queued':'Open');count.append(state);card.append(count,fmt('h2','',i.subject));const body=node('div','situation');body.append(L.markup(i.body,document));card.append(body);
if(i.kind==='decision'&&i.structured){const options=node('fieldset','options');options.setAttribute('aria-label',i.subject);for(const o of [...i.structured.options,{id:'other',label:'Something else'}]){const label=node('label',`opt${o.id==='other'?' other':''}`),input=node('input');input.type='radio';input.name=`choice-${i.id}`;input.value=o.id;input.checked=d.choice===o.id;input.onchange=()=>{d.choice=o.id;state.textContent='Queued';hint.hidden=!(d.choice==='other'&&!d.note.trim());update();};const ob=node('div','opt-body'),head=node('div','opt-head');head.append(node('span','opt-label',o.label));if(o.id===i.structured.recommended)head.append(node('span','pill','Recommended'));ob.append(head);if(o.summary)ob.append(fmt('div','',o.summary));for(const [k,v]of [['Upside',o.upside],['Downside',o.downside]])if(v){const row=node('div','trade');row.append(node('span','k',k),fmt('span','',v));ob.append(row);}if(o.id===i.structured.recommended)ob.append(fmt('div','why',`Why the coordinator recommends it: ${i.structured.reason}`));label.append(input,ob);options.append(label);}card.append(options);}
const note=node('div','note'),label=node('label','',i.kind==='fyi'?'Comment (optional unless sending feedback)':i.structured?'Note (required for Something else)':'Your answer'),text=node('textarea');text.id=`note-${i.id}`;label.htmlFor=text.id;text.value=d.note;text.placeholder=i.kind==='fyi'?'Add feedback for this coordinator…':'Add context…';text.maxLength=4096;text.oninput=()=>{d.note=text.value;if(i.kind==='decision'&&!i.structured)d.choice=d.note.trim()?'other':'';hint.hidden=!(i.kind==='decision'?d.choice==='other'&&!d.note.trim():d.action&&d.action!=='dismiss'&&!d.note.trim());state.textContent=(i.kind==='decision'?d.choice:d.action)?'Queued':'Open';update();};note.append(label,text);card.append(note);const hint=node('p','hint','Add a note to send this response.');hint.hidden=!(i.kind==='decision'?d.choice==='other'&&!d.note.trim():d.action&&d.action!=='dismiss'&&!d.note.trim());hint.setAttribute('role','alert');card.append(hint);
if(i.kind==='fyi'){const actions=node('div','fyi-actions');for(const [key,name]of [['comment','Comment'],['dismiss','Dismiss'],['comment_and_dismiss','Comment and dismiss']]){const b=btn(name,()=>{d.action=d.action===key?'':key;render();});b.setAttribute('aria-pressed',String(d.action===key));actions.append(b);}card.append(actions,node('p','subtle',d.action==='dismiss'?'Will dismiss silently. No coordinator message.':d.action==='comment_and_dismiss'?'Will send your comment and resolve this FYI.':d.action==='comment'?'Will send your comment. This FYI stays open.':'Choose an action to queue it. A comment by itself does not queue anything.'));}if(i.kind==='decision'&&d.choice)card.append(btn('Clear queued answer',()=>{d.choice='';d.note='';render();},'clear'));main.append(card);}
function renderReview(main){main.append(heading('Queued responses','These actions will be submitted together. Unselected items stay open.'));main.append(btn('← Keep reviewing boards',()=>{screen='browse';render();top();}));for(const c of coords){const list=queued().filter(i=>i.role===c.id);if(!list.length)continue;const section=node('section','review-list');section.style.marginTop='28px';section.append(node('h2','',c.name));for(const i of list){const row=node('div','receipt');row.append(node('strong','',`${actionLabel(i)} · #${i.id} ${i.subject}`));if(i.kind==='decision')row.append(node('p','',i.structured?.options.find(o=>o.id===draft(i).choice)?.label||'Something else'));if(draft(i).note&&draft(i).action!=='dismiss')row.append(node('p','subtle',draft(i).note));row.append(btn('Edit on board',()=>{visit(i.role);tab=i.kind;render();document.getElementById(`item-${i.id}`).scrollIntoView();},'clear'));section.append(row);}main.append(section);}}
function renderSent(main){const h=node('section','confirmation');h.append(node('p','preview-label','Simulated submission · nothing was sent'),node('h1','','Answers sent — you can close this tab'));const a=receipts.filter(r=>r.kind==='decision').length,c=receipts.filter(r=>r.action==='comment'||r.action==='comment_and_dismiss').length,x=receipts.filter(r=>r.action==='dismiss'||r.action==='comment_and_dismiss').length;h.append(node('p','intro',`${a} answer${a===1?'':'s'} · ${c} comment${c===1?'':'s'} · ${x} dismissal${x===1?'':'s'}`));for(const co of coords){const rows=receipts.filter(r=>r.role===co.id);if(!rows.length)continue;const group=node('div','receipt');group.append(node('strong','',co.name));for(const r of rows)group.append(node('p','subtle',`#${r.id} · ${r.kind==='decision'?'Answered':r.action==='comment'?'Comment sent · FYI stays open':r.action==='dismiss'?'Dismissed silently':'Comment sent · FYI dismissed'}`));h.append(group);}h.append(node('p','subtle','All selected actions succeeded. Unselected items stay open.'));h.append(btn('Return to Argus',()=>{screen='browse';selected=mode==='phone'?null:12;render();top();},'btn primary'));h.append(btn('Reset and try again',reset));main.append(h);}
function render(){const main=$('main');main.replaceChildren();$('queue').hidden=screen==='sent';if(screen==='sent')renderSent(main);else if(screen==='review')renderReview(main);else if(selected===null)renderDirectory(main);else renderBoard(main);update();}
function reset(){items=structuredClone(original);drafts={};receipts=[];screen='browse';selected=mode==='phone'?null:12;tab='decision';render();top();}
$('mode').onchange=()=>{mode=$('mode').value;screen='browse';selected=mode==='phone'?null:12;tab='decision';render();top();};$('reset').onclick=reset;$('review').onclick=()=>{screen='review';render();top();};$('submit').onclick=()=>{const q=queued();if(!q.length||q.some(i=>!valid(i)))return;receipts=q.map(i=>({...i,...draft(i)}));for(const i of q){if(i.kind==='decision'||draft(i).action!=='comment')i.closed=true;else i.commented=true;drafts[i.id]={choice:'',note:'',action:''};}screen='sent';render();top();};$('theme').value=document.documentElement.dataset.theme||'system';$('theme').onchange=()=>BoardDecisionTheme.set($('theme').value);render();
})();
</script>
</body></html>
